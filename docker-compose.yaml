# Sistema Peluquería - ejecución local con Oracle Autonomous Database (Wallet)
# Los secretos generales se leen desde .env

services:

  eureka:
    build:
      context: ./eureka
      dockerfile: Dockerfile
    container_name: peluqueria-eureka
    ports:
      - "8761:8761"
    environment:
      PORT: 8761
      RENDER_EXTERNAL_HOSTNAME: eureka
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - peluqueria-net

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: peluqueria-auth
    ports:
      - "8086:8086"
    environment:
      PORT: 8086
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC"
      DB_URL: "jdbc:oracle:thin:@a6etg25wwemt8hf_high?TNS_ADMIN=/app/wallet"
      DB_USERNAME: "PELUQUERIA"
      DB_PASSWORD: "ClaveSegura123!"
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET en .env}
      EUREKA_URL: http://eureka:8761/eureka/
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./Wallet_A6ETG25WWEMT8HFB:/app/wallet:ro
    depends_on:
      eureka:
        condition: service_healthy
    networks:
      - peluqueria-net

  cliente:
