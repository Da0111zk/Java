x-servicio: &servicio
  restart: unless-stopped
  depends_on:
    eureka:
      condition: service_healthy
  volumes:
    - ./Wallet_A6ETG25WWEMT8HFB:/app/wallet:ro

x-entorno: &entorno
  EUREKA_URL: http://eureka:8761/eureka/
  JWT_SECRET: ${JWT_SECRET:-VGhpcyJzQVNlY3JldEtleUZvclBlbHVxdWVyaWFBcHBsaWNhdGlvblNhZmVSYW5kb21TdHJpbmc=}
  JAVA_TOOL_OPTIONS: -Xmx256m

services:

  eureka:
    build: ./eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      PORT: 8761
      JAVA_TOOL_OPTIONS: -Xmx256m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway:
    build: ./gateway
    restart: unless-stopped
    depends_on:
      eureka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      <<: *entorno
      PORT: 8080

  tipoServicio:
    <<: *servicio
    build: ./tipoServicio
    ports:
      - "8081:8081"
    environment:
      <<: *entorno
      PORT: 8081

  profesional:
    <<: *servicio
    build: ./profesional
    ports:
      - "8082:8082"
    environment:
      <<: *entorno
      PORT: 8082

  disponibilidadProfesional:
